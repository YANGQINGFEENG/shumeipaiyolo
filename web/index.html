<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧农业 - 设备配置管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; }
        h1 {
            font-size: 1.8em;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 1.1em;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 0.9em;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95em;
        }
        .form-input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .btn-danger {
            background: #ff4444;
            color: #fff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        .status-ok { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status-error { background: rgba(255,68,68,0.2); color: #ff4444; }
        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .config-item .label { color: #888; }
        .config-item .value { color: #00d4ff; font-family: monospace; }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #00ff88;
            color: #000;
            border-radius: 8px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ 设备配置管理</h1>
            <p style="color:#888">配置硬件参数、服务器地址和API接口</p>
        </header>

        <!-- 服务器配置 -->
        <div class="section">
            <div class="section-title">🌐 服务器配置</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">服务器地址</label>
                    <input type="text" class="form-input" id="server_url" value="http://192.168.1.22:3000">
                </div>
                <div class="form-group">
                    <label class="form-label">WebSocket地址</label>
                    <input type="text" class="form-input" id="ws_url" value="ws://192.168.1.22:8080">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">农场ID</label>
                    <input type="number" class="form-input" id="farm_id" value="1">
                </div>
                <div class="form-group">
                    <label class="form-label">上报间隔(秒)</label>
                    <input type="number" class="form-input" id="report_interval" value="30">
                </div>
            </div>
        </div>

        <!-- 设备信息 -->
        <div class="section">
            <div class="section-title">📱 设备信息</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">网关IP</label>
                    <input type="text" class="form-input" id="gateway_ip" value="192.168.1.63">
                </div>
                <div class="form-group">
                    <label class="form-label">MAC地址</label>
                    <input type="text" class="form-input" id="mac_address" value="AA:BB:CC:DD:EE:FF">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">区域名称</label>
                    <input type="text" class="form-input" id="area_name" value="温室1号区域">
                </div>
                <div class="form-group">
                    <label class="form-label">设备类型</label>
                    <select class="form-input" id="device_type">
                        <option value="wifi_sensor">WiFi传感器</option>
                        <option value="wifi_gateway">WiFi网关</option>
                        <option value="lorawan">LoRaWAN</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- API配置 -->
        <div class="section">
            <div class="section-title">🔌 API接口配置</div>
            <div class="config-item">
                <span class="label">设备上报</span>
                <span class="value">POST /api/device/report</span>
            </div>
            <div class="config-item">
                <span class="label">指令轮询</span>
                <span class="value">GET /api/device/ack</span>
            </div>
            <div class="config-item">
                <span class="label">回执确认</span>
                <span class="value">POST /api/device/ack</span>
            </div>
            <div class="form-group" style="margin-top:15px">
                <label class="form-label">自定义API端点</label>
                <input type="text" class="form-input" id="custom_endpoint" placeholder="/api/custom/endpoint">
            </div>
        </div>

        <!-- 当前状态 -->
        <div class="section">
            <div class="section-title">📊 当前状态</div>
            <div class="config-item">
                <span class="label">服务器连接</span>
                <span class="status-badge status-ok" id="server_status">已连接</span>
            </div>
            <div class="config-item">
                <span class="label">最后上报</span>
                <span class="value" id="last_report">--</span>
            </div>
            <div class="config-item">
                <span class="label">上报次数</span>
                <span class="value" id="report_count">0</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="section">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveConfig()">💾 保存配置</button>
                <button class="btn btn-secondary" onclick="loadConfig()">📂 加载配置</button>
                <button class="btn btn-secondary" onclick="testConnection()">🔗 测试连接</button>
                <button class="btn btn-danger" onclick="resetConfig()">🔄 重置默认</button>
            </div>
        </div>

        <div class="toast" id="toast">配置已保存</div>
    </div>

    <script>
        // 本地存储键名
        const STORAGE_KEY = 'smart_farm_config';

        // 默认配置
        const defaultConfig = {
            server_url: 'http://192.168.1.22:3000',
            ws_url: 'ws://192.168.1.22:8080',
            farm_id: 1,
            report_interval: 30,
            gateway_ip: '192.168.1.63',
            mac_address: 'AA:BB:CC:DD:EE:FF',
            area_name: '温室1号区域',
            device_type: 'wifi_sensor',
            custom_endpoint: ''
        };

        // 加载配置
        function loadConfig() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const config = JSON.parse(saved);
                Object.keys(config).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = config[key];
                });
                showToast('配置已加载');
            } else {
                showToast('无保存的配置');
            }
        }

        // 保存配置
        function saveConfig() {
            const config = {};
            Object.keys(defaultConfig).forEach(key => {
                const el = document.getElementById(key);
                if (el) config[key] = el.value;
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            showToast('配置已保存');
        }

        // 重置配置
        function resetConfig() {
            Object.keys(defaultConfig).forEach(key => {
                const el = document.getElementById(key);
                if (el) el.value = defaultConfig[key];
            });
            localStorage.removeItem(STORAGE_KEY);
            showToast('配置已重置');
        }

        // 测试连接
        function testConnection() {
            const url = document.getElementById('server_url').value;
            fetch(url + '/api/farms')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('server_status').textContent = '已连接';
                    document.getElementById('server_status').className = 'status-badge status-ok';
                    showToast('连接成功');
                })
                .catch(e => {
                    document.getElementById('server_status').textContent = '连接失败';
                    document.getElementById('server_status').className = 'status-badge status-error';
                    showToast('连接失败: ' + e.message);
                });
        }

        // 显示提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        // 页面加载时读取配置
        loadConfig();
    </script>
</body>
</html>

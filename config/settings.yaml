# 系统配置
system:
  name: "smart-farm-pi"
  version: "1.0.0"
  log_level: "DEBUG"
  log_file: "logs/system.log"

# 上传配置 (匹配新API格式)
upload:
  server_url: "http://192.168.1.22:3000"
  gateway_id: 1
  gateway_ip: "192.168.1.63"
  gateway_type: "wifi_sensor"
  mac: "AA:BB:CC:DD:EE:FF"
  farm_id: 1
  interval: 30
  timeout: 10
  max_retries: 3
  retry_delay: 5

# 设备节点配置 (node_id到API类型的映射)
# 服务器接受的传感器类型: temperature, humidity, light, soil_moisture, soil_temperature, ph, ec, co2, pm25, water_level, battery
# 服务器接受的执行器类型: water_pump, fan, heater, valve, light, ventilator, fogger
device_mapping:
  sensors:
    dht11_temp:
      node_id: "T-1-001"
      type: "temperature"
      name: "空气温度传感器"
    dht11_humidity:
      node_id: "H-1-001"
      type: "humidity"
      name: "空气湿度传感器"
    bmp280_temp:
      node_id: "T-1-002"
      type: "temperature"
      name: "BMP280温度"
    bmp280_pressure:
      node_id: "CO-1-001"
      type: "co2"
      name: "气压传感器"
    vibration:
      node_id: "B-1-001"
      type: "battery"
      name: "振动传感器"
  actuators:
    relay:
      node_id: "VL-1-001"
      type: "valve"
      name: "继电器"
    laser:
      node_id: "LT-1-001"
      type: "light"
      name: "激光"
    rgb_led:
      node_id: "LT-1-002"
      type: "light"
      name: "RGB-LED"

# 缓存配置
cache:
  db_path: "data/cache.db"
  max_age_days: 7

# 心跳配置
heartbeat:
  enabled: true
  interval: 30

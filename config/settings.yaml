# 系统配置
system:
  name: "smart-farm-pi"
  version: "1.0.0"
  log_level: "INFO"
  log_file: "logs/system.log"

# 上传配置 (简化格式)
upload:
  server_url: "http://192.168.1.22:3000"
  gateway_ip: "192.168.1.63"
  farm_id: 1
  interval: 30
  timeout: 10
  max_retries: 3
  retry_delay: 5

# 设备节点配置 (sensor_id_value_key -> API类型的映射)
# 服务器接受的传感器类型: temperature, humidity, light, soil_moisture, soil_temperature, ph, ec, co2, pm25, water_level, battery
# 服务器接受的执行器类型: water_pump, fan, heater, valve, light, ventilator, fogger
device_mapping:
  sensors:
    # DHT11: value dict keys are "temperature" and "humidity"
    dht11_temperature:
      node_id: "T-1-001"
      type: "temperature"
      name: "空气温度传感器"
    dht11_humidity:
      node_id: "H-1-001"
      type: "humidity"
      name: "空气湿度传感器"
    # BMP280: value dict keys are "temperature" and "pressure"
    bmp280_temperature:
      node_id: "T-1-002"
      type: "temperature"
      name: "BMP280温度"
    bmp280_pressure:
      node_id: "PR-1-001"
      type: "pressure"
      name: "气压传感器"
    bmp280_altitude:
      node_id: "AL-1-001"
      type: "altitude"
      name: "海拔"
    # Vibration: value is boolean
    vibration:
      node_id: "VB-1-001"
      type: "vibration"
      name: "振动传感器"
  actuators:
    relay:
      node_id: "VL-1-001"
      type: "valve"
      name: "继电器"
    laser:
      node_id: "LT-1-001"
      type: "light"
      name: "激光"
    rgb_led:
      node_id: "LT-1-002"
      type: "light"
      name: "RGB-LED"

# 缓存配置
cache:
  db_path: "data/cache.db"
  max_age_days: 7

# 心跳配置
heartbeat:
  enabled: true
  interval: 30

# 硬件系统配置

# 网关配置
gateway:
  ip: "192.168.1.63"
  type: "wifi_sensor"
  mac: "AA:BB:CC:DD:EE:FF"
  farm_id: 1
  area: "温室1号区域"

# 服务器配置
server:
  url: "http://192.168.1.22:3000"
  websocket_url: "ws://192.168.1.22:8080"
  report_interval: 30  # 数据上报间隔（秒）
  poll_interval: 2     # 指令轮询间隔（秒）

# 传感器配置
sensors:
  - id: "T-1-001"
    name: "空气温度传感器"
    type: "temperature"
    driver: "DHTSensor"
    config:
      pin: 6
      sensor_type: "DHT11"

  - id: "P-1-001"
    name: "气压传感器"
    type: "pressure"
    driver: "BMP280Sensor"
    config:
      address: 0x76

  - id: "V-1-001"
    name: "振动传感器"
    type: "vibration"
    driver: "VibrationSensor"
    config:
      pin: 12

  - id: "L-1-001"
    name: "光照传感器"
    type: "light"
    driver: "LightSensor"
    config:
      channel: 0

  - id: "SM-1-001"
    name: "土壤湿度传感器"
    type: "soil_moisture"
    driver: "SoilMoistureSensor"
    config:
      channel: 1

# 执行器配置
actuators:
  - id: "RL-1-001"
    name: "继电器"
    type: "relay"
    driver: "RelayActuator"
    config:
      pin: 16

  - id: "MT-1-001"
    name: "通风电机"
    type: "motor"
    driver: "MotorActuator"
    control_type: "integer"
    control_range:
      min: 0
      max: 100
      step: 5
      default: 0
    config:
      pin: 18

  - id: "SV-1-001"
    name: "舵机"
    type: "servo"
    driver: "ServoActuator"
    control_type: "angle"
    control_range:
      min: 0
      max: 180
      step: 1
      default: 90
    config:
      pin: 23

  - id: "LT-1-001"
    name: "补光灯"
    type: "led"
    driver: "LedActuator"
    control_type: "boolean"
    config:
      pin: 24

  - id: "VL-1-001"
    name: "电磁阀"
    type: "valve"
    driver: "ValveActuator"
    control_type: "boolean"
    config:
      pin: 25

# 日志配置
logging:
  level: "INFO"
  file: "logs/hardware.log"
